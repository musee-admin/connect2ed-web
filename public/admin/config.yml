defs:
  - seoRef: &seo-ref
      label: "SEO"
      name: "seo"
      widget: "object"
      collapsed: true
      fields:
        - { label: "Page Title", name: "title", widget: "string" }
        - { label: "Meta Description", name: "description", widget: "text" }

  - typesRef: &types-ref
      label: "Sections"
      name: "sections"
      widget: "list"
      collapsed: true
      types:
        - label: "Hero"
          name: "hero"
          widget: object
          summary: "{{fields.title}}"
          fields:
            - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
            - { label: "Title", name: "title", widget: "string" }
            - { label: "Lead Text", name: "lead", widget: "text", required: false }
            - {
                label: "Image",
                name: "image",
                widget: "image",
                required: false,
                media_library: { config: { multiple: false } },
              }
            - { label: "Image Alt Text", name: "image_alt", widget: "string", required: false }
            - { label: "Primary Button Text", name: "primary_cta_text", widget: "string", required: false }
            - { label: "Primary Button Link", name: "primary_cta_link", widget: "string", required: false }
            - { label: "Secondary Button Text", name: "secondary_cta_text", widget: "string", required: false }
            - { label: "Secondary Button Link", name: "secondary_cta_link", widget: "string", required: false }
            - {
                label: "Stats",
                name: "stats",
                widget: "list",
                required: false,
                fields:
                  [
                    { label: "Value", name: "value", widget: "string" },
                    { label: "Label", name: "label", widget: "string" },
                  ],
              }

        - label: "Intro Columns"
          name: "intro_columns"
          widget: object
          summary: "Intro columns"
          fields:
            - {
                label: "Columns",
                name: "items",
                widget: "list",
                fields:
                  [
                    { label: "Title", name: "title", widget: "string" },
                    { label: "Body", name: "body", widget: "text" },
                  ],
              }

        - label: "Feature Grid"
          name: "feature_grid"
          widget: object
          summary: "{{fields.title}}"
          fields:
            - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
            - { label: "Title", name: "title", widget: "string" }
            - { label: "Description", name: "description", widget: "text", required: false }
            - {
                label: "Tone",
                name: "tone",
                widget: "select",
                options: ["light", "dark"],
                default: "light",
                required: false,
              }
            - { label: "Button Text", name: "cta_text", widget: "string", required: false }
            - { label: "Button Link", name: "cta_link", widget: "string", required: false }
            - {
                label: "Items",
                name: "items",
                widget: "list",
                fields:
                  [
                    { label: "Title", name: "title", widget: "string" },
                    { label: "Description", name: "description", widget: "text" },
                  ],
              }

        - label: "Media Cards (videos)"
          name: "media_cards"
          widget: object
          summary: "{{fields.title}}"
          fields:
            - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
            - { label: "Title", name: "title", widget: "string" }
            - { label: "Description", name: "description", widget: "text", required: false }
            - {
                label: "Items",
                name: "items",
                widget: "list",
                fields:
                  [
                    { label: "Title", name: "title", widget: "string" },
                    { label: "Kicker", name: "sub_heading", widget: "string", required: false },
                    { label: "Description", name: "description", widget: "text" },
                    {
                      label: "Video",
                      name: "video",
                      widget: "file",
                      media_library: { config: { multiple: false } },
                    },
                  ],
              }

        - label: "Steps"
          name: "steps"
          widget: object
          summary: "{{fields.title}}"
          fields:
            - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
            - { label: "Title", name: "title", widget: "string" }
            - { label: "Description", name: "description", widget: "text", required: false }
            - {
                label: "Items",
                name: "items",
                widget: "list",
                fields:
                  [
                    { label: "Title", name: "title", widget: "string" },
                    { label: "Sub Heading", name: "sub_heading", widget: "string", required: false },
                    { label: "Description", name: "description", widget: "text" },
                    {
                      label: "Illustration",
                      name: "image",
                      widget: "image",
                      required: false,
                      media_library: { config: { multiple: false } },
                    },
                  ],
              }

        - label: "Feature Split (text + image)"
          name: "feature_split"
          widget: object
          summary: "{{fields.title}}"
          fields:
            - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
            - { label: "Title", name: "title", widget: "string" }
            - { label: "Description", name: "description", widget: "text" }
            - {
                label: "Image",
                name: "image",
                widget: "image",
                media_library: { config: { multiple: false } },
              }
            - { label: "Image Alt Text", name: "image_alt", widget: "string", required: false }
            - {
                label: "Image Side",
                name: "image_side",
                widget: "select",
                options: ["left", "right"],
                default: "right",
              }
            - { label: "Button Text", name: "cta_text", widget: "string", required: false }
            - { label: "Button Link", name: "cta_link", widget: "string", required: false }

        - label: "Cards (images)"
          name: "cards"
          widget: object
          summary: "{{fields.title}}"
          fields:
            - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
            - { label: "Title", name: "title", widget: "string" }
            - { label: "Description", name: "description", widget: "text", required: false }
            - {
                label: "Items",
                name: "items",
                widget: "list",
                fields:
                  [
                    { label: "Title", name: "title", widget: "string" },
                    { label: "Kicker", name: "sub_heading", widget: "string", required: false },
                    { label: "Description", name: "description", widget: "text", required: false },
                    {
                      label: "Image",
                      name: "image",
                      widget: "image",
                      required: false,
                      media_library: { config: { multiple: false } },
                    },
                  ],
              }

        - label: "Team"
          name: "team"
          widget: object
          summary: "{{fields.title}}"
          fields:
            - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
            - { label: "Title", name: "title", widget: "string" }
            - { label: "Description", name: "description", widget: "text", required: false }
            - {
                label: "People",
                name: "items",
                widget: "list",
                fields:
                  [
                    { label: "Tag Line", name: "tag", widget: "string", required: false },
                    { label: "Name", name: "name", widget: "string" },
                    { label: "Credentials", name: "creds", widget: "string" },
                    { label: "Bio", name: "description", widget: "text" },
                    {
                      label: "Photo",
                      name: "image",
                      widget: "image",
                      media_library: { config: { multiple: false } },
                    },
                  ],
              }

        - label: "Ecosystem"
          name: "ecosystem"
          widget: object
          summary: "{{fields.title}}"
          fields:
            - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
            - { label: "Title", name: "title", widget: "string" }
            - { label: "Description", name: "description", widget: "text", required: false }
            - { label: "Intro Note", name: "intro", widget: "text", required: false }
            - {
                label: "Student Image",
                name: "student_image",
                widget: "image",
                required: false,
                media_library: { config: { multiple: false } },
              }
            - {
                label: "Members",
                name: "members",
                widget: "list",
                fields:
                  [
                    { label: "Role", name: "role", widget: "string" },
                    { label: "Description", name: "description", widget: "text" },
                    {
                      label: "Image",
                      name: "image",
                      widget: "image",
                      required: false,
                      media_library: { config: { multiple: false } },
                    },
                  ],
              }

        - label: "FAQs"
          name: "faqs"
          widget: object
          summary: "{{fields.title}}"
          fields:
            - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
            - { label: "Title", name: "title", widget: "string" }
            - { label: "Description", name: "description", widget: "text", required: false }
            - {
                label: "Questions",
                name: "questions",
                widget: "list",
                fields:
                  [
                    { label: "Question", name: "question", widget: "text" },
                    { label: "Answer", name: "answer", widget: "text" },
                  ],
              }

        - label: "Stat Callout"
          name: "stat_callout"
          widget: object
          summary: "{{fields.title}}"
          fields:
            - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
            - { label: "Title", name: "title", widget: "string" }
            - { label: "Stat Value", name: "stat_value", widget: "string" }
            - { label: "Stat Label", name: "stat_label", widget: "string" }
            - { label: "Description", name: "description", widget: "text" }

        - label: "Contact"
          name: "contact"
          widget: object
          summary: "{{fields.title}}"
          fields:
            - { label: "Eyebrow", name: "eyebrow", widget: "string", required: false }
            - { label: "Title", name: "title", widget: "string" }
            - { label: "Description", name: "description", widget: "text", required: false }

local_backend: true
backend:
  name: git-gateway
  branch: main
media_folder: public/img
public_folder: img
collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Site Settings"
        name: "basic"
        file: "content/pages/basic.md"
        fields:
          - label: "Full Logo"
            name: "full_logo"
            widget: "image"
            media_library: { config: { multiple: false } }

          - label: "Mini Logo"
            name: "mini_logo"
            widget: "image"
            media_library: { config: { multiple: false } }

          - label: "Name"
            name: "name"
            widget: "string"

          - label: "Footer CTA Message"
            name: "message"
            widget: "string"

          - label: "Phone Number"
            name: "phone_number"
            widget: "string"

          - label: "Email Id"
            name: "email_id"
            widget: "string"

          - label: "Address"
            name: "address"
            widget: "text"

          - label: "Linkedin"
            name: "linkedin"
            widget: "string"
            required: false

          - label: "Instagram"
            name: "instagram"
            widget: "string"
            required: false

          - label: "Facebook"
            name: "facebook"
            widget: "string"
            required: false

          - label: "X"
            name: "x"
            widget: "string"
            required: false

      - label: "Home"
        name: "home"
        file: "content/pages/home.md"
        fields:
          - *seo-ref
          - *types-ref

      - label: "Our Solution"
        name: "our_solution"
        file: "content/pages/our_solution.md"
        fields:
          - *seo-ref
          - *types-ref

      - label: "Knowledge Center"
        name: "knowledge_center"
        file: "content/pages/knowledge_center.md"
        fields:
          - *seo-ref
          - *types-ref

      - label: "Our Ecosystem"
        name: "our_ecosystem"
        file: "content/pages/our_ecosystem.md"
        fields:
          - *seo-ref
          - *types-ref

      - label: "About Us"
        name: "about_us"
        file: "content/pages/about_us.md"
        fields:
          - *seo-ref
          - *types-ref

      - label: "Contact Us"
        name: "contact_us"
        file: "content/pages/contact_us.md"
        fields:
          - *seo-ref
          - *types-ref
